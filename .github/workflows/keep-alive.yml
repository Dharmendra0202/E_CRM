name: Supabase Keep-Alive

# Keeps the Supabase free-tier database awake.
#
# The free tier pauses a project after 7 days of no DATABASE activity. This
# workflow runs a trivial query every 5 days (comfortably inside the 7-day
# window, with margin for a skipped/delayed run) so the project never pauses.
#
# Setup (one time):
#   GitHub repo → Settings → Secrets and variables → Actions → New repository
#   secret → name: DATABASE_URL, value: your Supabase POOLED connection string
#   (the same DATABASE_URL from backend/.env, port 6543, ?pgbouncer=true).
#
# You can also trigger it manually from the Actions tab (workflow_dispatch).

on:
  schedule:
    # At 06:00 UTC every 5th day of the month (1, 6, 11, 16, 21, 26, 31).
    # Worst-case gap between runs is 6 days (26 → 31 → 1), still under 7.
    - cron: "0 6 */5 * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Avoid overlapping runs.
concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Prisma client (minimal)
        working-directory: backend
        run: |
          npm install @prisma/client prisma --no-save --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Ping database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/keep-alive.js
